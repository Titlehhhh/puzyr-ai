name: Обновить котировки

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Два прогона одновременно коммитят один файл и второй push падает.
concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Собрать рыночные данные
        run: node scripts/fetch-market.mjs

      - name: Зафиксировать изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/market.json; then
            echo "Котировки не изменились, коммит не нужен"
          else
            git add data/market.json
            git commit -m "chore: обновление котировок"
            git pull --rebase origin main
            git push
          fi