name: Обновить котировки

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Собрать рыночные данные
        run: node scripts/fetch-market.mjs

      - name: Зафиксировать изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/market.json; then
            echo "Котировки не изменились, коммит не нужен"
          else
            git add data/market.json
            git commit -m "chore: обновление котировок"
            git push
          fi